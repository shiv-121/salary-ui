<mat-sidenav-container class="app-shell">
  <mat-sidenav class="app-sidenav" mode="side" opened>
    <a class="brand" routerLink="/dashboard" aria-label="ACME Salary Management home">
      <span class="brand-mark" aria-hidden="true"><mat-icon>account_balance</mat-icon></span>
      <span class="brand-copy">
        <strong>ACME</strong>
        <span>Salary Management</span>
      </span>
    </a>

    <mat-divider></mat-divider>

    <nav class="side-nav" aria-label="Primary navigation">
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-nav" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon matListItemIcon aria-hidden="true">dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/employees" routerLinkActive="active-nav" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon matListItemIcon aria-hidden="true">groups</mat-icon>
        <span matListItemTitle>Employees</span>
      </a>
    </nav>

    <div class="sidenav-footer">
      <mat-icon aria-hidden="true">shield</mat-icon>
      <span>HR Manager</span>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="app-main">
    <mat-toolbar class="app-header">
      <div class="header-context" aria-label="ACME People Operations Salary Management">
        <span class="header-mark" aria-hidden="true"><mat-icon>corporate_fare</mat-icon></span>
        <span class="header-kicker">ACME PEOPLE OPERATIONS</span>
      </div>
    </mat-toolbar>

    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
